name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Load the official signing key (main repo only)
        env:
          KEYSTORE_B64: ${{ secrets.MATCHDAY_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > app/release.keystore

      - name: Build
        env:
          MATCHDAY_KEY_PASSWORD: ${{ secrets.MATCHDAY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E '^e: |error:|FAILURE|What went wrong' -A2 build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk matchday.apk
          rm -f app/release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: matchday-apk
          path: matchday.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest matchday.apk \
            --title "Matchday build ${{ github.run_number }}" \
            --notes "Automatic build of ${{ github.sha }}" \
            --latest
