name: Refresh crests

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Look up crests
        run: python3 tools/fetch_crests.py

      - name: Commit crests into the app
        run: |
          git config user.name "ShedTV crest bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/crests.json
          git diff --cached --quiet || git commit -m "Update bundled club crests"
          git push
